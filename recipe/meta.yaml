{% set name = "lsst-versions" %}
{% set version = "1.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d013d919e2474438ccf73d3f6ec38401a4ad942f7c91ed1b5664c22ba0b67dec

build:
  entry_points:
    - lsst-version = lsst_versions._cmd:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  script_env: PYTHONUTF8=1
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - tomli >1.0
    - gitpython
    - packaging
    - pip
  run:
    - python >={{ python_min }}
    - setuptools >=46.0
    - tomli >1.0.0
    - gitpython >=3.1
    - git
    - packaging

test:
  imports:
    - lsst_versions
  commands:
    - pip check
    - lsst-version --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/lsst/lsst_versions
  summary: Calculate package versions following LSST code conventions.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - erykoff
    - timj
    - TallJimbo
    - camposandro
